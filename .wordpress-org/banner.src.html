<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  html, body { width: 100%; height: 100%; }
  .banner {
    width: 100vw; height: 100vh;
    background: linear-gradient(120deg, #4f46e5 0%, #7c3aed 52%, #9333ea 100%);
    display: flex; align-items: center; gap: 4vw;
    padding: 0 7vw; color: #fff; position: relative; overflow: hidden;
  }
  .banner::after {
    content: ""; position: absolute; right: -8vw; top: -30vh;
    width: 60vh; height: 60vh; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
  }
  .left { flex: 1.2; z-index: 1; }
  .eyebrow {
    display: inline-block; font-size: 3.1vh; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: #c7f9e5; background: rgba(52,211,153,.16);
    border: 1px solid rgba(52,211,153,.5); padding: .7vh 1.6vh; border-radius: 999px; margin-bottom: 3.2vh;
  }
  h1 { font-size: 12.5vh; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .wc { display: block; font-size: 5.2vh; font-weight: 600; opacity: .85; margin-top: 1.2vh; letter-spacing: 0; }
  .brand { position: absolute; left: 7vw; bottom: 5vh; font-weight: 700; font-size: 3.4vh; opacity: .9; letter-spacing: .02em; }
  .brand b { color: #34d399; }
  .right { flex: 1; z-index: 1; display: flex; justify-content: center; }
  .card {
    width: 90%; max-width: 46vh; background: #fff; border-radius: 2.4vh; padding: 3vh 3vh;
    box-shadow: 0 4vh 8vh rgba(0,0,0,.28); color: #1e1e2e;
  }
  .row { display: flex; align-items: center; gap: 1.4vh; margin: 1.5vh 0; }
  .lbl { font-size: 2.5vh; color: #555; width: 30%; }
  .inp { flex: 1; height: 4.6vh; background: #f1f1f6; border-radius: 1vh; }
  .pill { display: inline-flex; align-items: center; gap: 1vh; font-size: 2.4vh; font-weight: 700; color: #4f46e5; background: #eef2ff; border-radius: 999px; padding: 1vh 1.8vh; }
  .cond { margin-top: 2vh; padding: 1.8vh; background: #f6fdf9; border: 1px dashed #34d399; border-radius: 1.4vh; font-size: 2.3vh; color: #0b3b2e; }
  .cond b { color: #047857; }
  .dot { width: 1.8vh; height: 1.8vh; border-radius: 50%; background: #34d399; }
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <span class="eyebrow">Conditional logic — free</span>
      <h1>Checkout Fields<span class="wc">for WooCommerce · classic + Block</span></h1>
    </div>
    <div class="right">
      <div class="card">
        <div class="pill"><span class="dot"></span> Add to Checkout</div>
        <div class="row"><span class="lbl">VAT&nbsp;ID</span><span class="inp"></span></div>
        <div class="row"><span class="lbl">Delivery</span><span class="inp"></span></div>
        <div class="cond">When <b>Payment</b> is <b>COD</b> → show this field</div>
      </div>
    </div>
    <div class="brand">Core<b>Labs</b></div>
  </div>
</body>
</html>
