<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }
  .canvas {
    width: 1544px;
    height: 500px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(120deg, #5B4DF0 0%, #4F46E5 42%, #6D28D9 100%);
    color: #ffffff;
  }
  .bloom {
    position: absolute; inset: 0;
    background:
      radial-gradient(58% 90% at 90% 16%, rgba(167,139,250,0.50) 0%, rgba(167,139,250,0) 60%),
      radial-gradient(48% 80% at 4% 94%, rgba(99,102,241,0.42) 0%, rgba(99,102,241,0) 60%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 24%, #000 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 24%, #000 100%);
  }
  .content {
    position: absolute; left: 100px; top: 0; height: 100%; width: 740px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
    padding: 8px 16px; border-radius: 999px;
    background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.24);
    font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: #F1EDFF; margin-bottom: 28px;
  }
  .eyebrow .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #34D399; box-shadow: 0 0 0 4px rgba(52,211,153,0.25);
  }
  h1 { font-size: 78px; line-height: 0.98; font-weight: 800; letter-spacing: -0.024em; }
  h1 .l2 { display: block; }
  .woo { font-size: 23px; font-weight: 700; letter-spacing: 0.01em; color: #C4B5FD; margin-top: 16px; margin-bottom: 28px; }
  .woo strong { color: #ffffff; }
  .tagline { font-size: 25px; line-height: 1.42; font-weight: 500; color: #E9E5FF; max-width: 640px; }
  .tagline .hl { color: #ffffff; font-weight: 700; }

  .motif { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 560px; }
  .card {
    position: relative;
    background: rgba(255,255,255,0.98);
    border-radius: 24px;
    box-shadow: 0 44px 84px -28px rgba(23,12,80,0.7), 0 0 0 1px rgba(255,255,255,0.5);
    padding: 24px 28px 26px 28px;
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .card-head .ttl { margin-left: 8px; font-size: 14px; font-weight: 800; color: #4F46E5; letter-spacing: 0.02em; }
  .tl { width: 11px; height: 11px; border-radius: 50%; }

  .pay { display: flex; gap: 14px; margin-bottom: 18px; }
  .pm {
    flex: 1; display: flex; align-items: center; gap: 11px;
    height: 54px; padding: 0 16px; border-radius: 14px;
    font-size: 15.5px; font-weight: 700;
  }
  .pm .radio { width: 19px; height: 19px; border-radius: 50%; flex: none; }
  .pm.off { background: #F4F4FB; border: 1.5px solid #E4E4F4; color: #6B7194; }
  .pm.off .radio { border: 2px solid #C3C6DD; background: #fff; }
  .pm.on { background: #F2FBF7; border: 1.5px solid #34D399; color: #065F46; box-shadow: 0 6px 18px -8px rgba(52,211,153,0.55); }
  .pm.on .radio { border: 2px solid #10B981; background: radial-gradient(circle, #10B981 5px, #fff 5.6px); }

  .reveal { position: relative; margin-left: 58px; }
  .branch { position: absolute; left: -58px; top: -16px; width: 58px; height: calc(100% + 16px); overflow: visible; }
  .ifbadge {
    position: absolute; left: -50px; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 13px;
    background: linear-gradient(135deg, #6366F1, #8B5CF6);
    box-shadow: 0 10px 20px -6px rgba(79,70,229,0.75);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 0.02em; z-index: 2;
  }
  .field {
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 16px; border-radius: 14px;
    background: #ffffff; border: 1.5px solid #A7F3D0;
    box-shadow: 0 10px 24px -12px rgba(16,185,129,0.45);
  }
  .field .check {
    width: 24px; height: 24px; border-radius: 7px; flex: none;
    background: #10B981; position: relative;
  }
  .field .check::after {
    content: ""; position: absolute; left: 8px; top: 4px;
    width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(43deg);
  }
  .field .label { font-size: 16px; font-weight: 600; color: #134E4A; }
  .field .tag {
    margin-left: auto; font-size: 12.5px; font-weight: 800; color: #047857;
    background: #D1FAE5; border: 1.5px solid #A7F3D0; border-radius: 999px; padding: 5px 11px;
    letter-spacing: 0.02em;
  }
  .place {
    margin-top: 18px; height: 54px; border-radius: 14px;
    background: #211F3C;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="bloom"></div>
    <div class="grid"></div>
    <div class="content">
      <span class="eyebrow"><span class="dot"></span>Conditional logic &mdash; free</span>
      <h1>CoreLabs Checkout<span class="l2">Fields</span></h1>
      <div class="woo">for <strong>WooCommerce</strong></div>
      <p class="tagline">Add custom checkout fields, then <span class="hl">show, hide or require</span> them by cart, role, shipping or payment &mdash; on <span class="hl">classic and Block</span> checkout.</p>
    </div>
    <div class="motif">
      <div class="card">
        <div class="card-head">
          <span class="tl" style="background:#FF5F57"></span>
          <span class="tl" style="background:#FEBC2E"></span>
          <span class="tl" style="background:#28C840"></span>
          <span class="ttl">Checkout</span>
        </div>
        <div class="pay">
          <div class="pm off"><span class="radio"></span>Card</div>
          <div class="pm on"><span class="radio"></span>Cash on delivery</div>
        </div>
        <div class="reveal">
          <svg class="branch" viewBox="0 0 58 72" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 0 C 40 26, 14 18, 14 40" stroke="#34D399" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
            <path d="M14 40 L 14 44 C 14 44, 14 44, 22 44 L 58 44" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <div class="ifbadge">IF</div>
          <div class="field">
            <span class="check"></span>
            <span class="label">I&rsquo;ll have exact cash ready</span>
            <span class="tag">SHOWN</span>
          </div>
        </div>
        <div class="place">Place order</div>
      </div>
    </div>
  </div>
</body>
</html>
