<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { display: flex; }
  .icon {
    width: 100vmin; height: 100vmin;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #9333ea 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  svg { width: 62vmin; height: 62vmin; display: block; }
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- form field bars -->
      <rect x="10" y="16" width="58" height="11" rx="5.5" fill="#ffffff"/>
      <rect x="10" y="44.5" width="42" height="11" rx="5.5" fill="#ffffff"/>
      <rect x="10" y="73" width="58" height="11" rx="5.5" fill="#ffffff" opacity="0.55"/>
      <!-- conditional branch from middle field to a node -->
      <path d="M52 50 H74 a8 8 0 0 1 8 8 V70" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
      <circle cx="82" cy="75" r="9" fill="#34d399"/>
      <!-- checkmark in node -->
      <path d="M78 75.5 l3 3 l5.5 -6" stroke="#0b3b2e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</body>
</html>
