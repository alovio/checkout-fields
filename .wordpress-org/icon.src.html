<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }
  .canvas {
    width: 256px; height: 256px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #5B4DF0 0%, #6D28D9 100%);
  }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="canvas">
    <svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- source node -->
      <circle cx="62" cy="128" r="26" fill="#ffffff"/>
      <circle cx="62" cy="128" r="11" fill="#6D28D9"/>
      <!-- dotted branch up (shown) -->
      <path d="M62 96 C 62 76, 92 84, 100 84" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="0.5 13"/>
      <!-- dotted branch down (hidden) -->
      <path d="M62 160 C 62 180, 92 172, 100 172" stroke="rgba(255,255,255,0.55)" stroke-width="8" stroke-linecap="round" stroke-dasharray="0.5 13"/>
      <!-- shown pill -->
      <rect x="104" y="56" width="116" height="56" rx="28" fill="#ffffff"/>
      <rect x="120" y="76" width="44" height="16" rx="8" fill="#C4B5FD"/>
      <rect x="176" y="70" width="28" height="28" rx="8" fill="#34D399"/>
      <path d="M183.5 84.5 l4.5 4.5 l8 -9" stroke="#065F46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- hidden pill (ghost) -->
      <rect x="104" y="144" width="116" height="56" rx="28" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.65)" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
      <rect x="120" y="164" width="44" height="16" rx="8" fill="rgba(255,255,255,0.4)"/>
    </svg>
  </div>
</body>
</html>
